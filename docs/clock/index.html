<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
	<link href="css/clock.css" rel="stylesheet" type="text/css" />
	<script>
		"use strict"
		console.clear();

		var swk;
		var whenServiceWorkerReady = () => { };

		try {
			//console.clear();
			if ('serviceWorker' in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register('sw.js')
						.then(reg => console.log("Service worker registered"))
						.catch(err => console.error(`Service Worker Error: ${err}`));


					navigator.serviceWorker.ready.then((registration) => {
						swk = registration.active;
						console.log("Service worker ready");
						whenServiceWorkerReady();

						navigator.serviceWorker.addEventListener("message", msg => {
							console.log("from sw", msg.data);
							// if (msg.type == "connected") {
							// 	connectionResponse(mag.on);
							// }
						});
					});
				});
			}
		} catch (e) {
			console.error(e);
		}		
	</script>
	<script src="version.js"></script>
	<script src="common/storage.js"></script>
	<script src="common/comms.js"></script>
	<script src="js/suntimes.js"></script>
	<script src="js/clock.js"></script>
	<script src="js/clockextras.js"></script>

</head>

<body style="font-family: sans-serif; user-select: none; margin: 0;">
	<div id="everything">
		<div id="main" style="height: 100vh; margin: 0; font-weight: bold;">
			<div id="clockhead" style="font-size: 10vw; text-align: right; padding-right: 0.5em; padding-top: 1vw;">
			</div>
			<div
				style="position: relative; font-size: 36vw; text-align: center; margin-top: -4vw; margin-bottom: -4vw;">
				<div id="clock" style="width: 100%; "></div>
			</div>
		</div>
		<div id="status" style="position: absolute; top: 0; left: 0; width: 100%; height: 1.2vw;"></div>
		<div id="settings" style="padding: 1vw;  background-color: #ccc; padding-top: 50vh;">
			<input id="runit" type="button" value="&#9658;" onclick="goToWork(event.target.value);"
				style="position: absolute; top: 10vw; left: 20vw; font-size: 20vw;">
			<br><br>Alarm Time <input id="alarmtime" type="time" value=""
				onchange="setAlarmTime(event.target.value, 0);">
			Disable <input id="disablealarm" type="checkbox">
			<br><br>Chime
			<select id="chimetype" onchange="setChimeTime(event.target.value, 2)">
				<option value="0">Off</option>
				<option value="15">every quarter</option>
				<option value="30">every half</option>
				<option value="60">every hour</option>
			</select>
			<br><br>Tick
			<select id="ticktype" onchange="setTickType(event.target.value)">
				<option value="0">Off</option>
				<option value="1">every 1 minute</option>
				<option value="5">every 5 minutes</option>
				<option value="15">every 15 minutes</option>
			</select>
			<br><br>Chime and tick start <input id="chimestart" type="time" value=""
				onchange="setChimeTime(event.target.value, 0);">
			end <input id="chimeend" type="time" value="" onchange="setChimeTime(event.target.value, 1);">
			<br><br><br>24 hour display <input id="hr24" type="checkbox" onchange="change24hr(event.target.checked)">
			<br><br>

			Show <select id="show">
				<option value="ampm">Weekday and AM/PM</option>
				<option value="date">Full date</option>
				<option value="black">Black screen</option>
			</select>

			<br><br>
			<div id="choices" class="len1"></div>
			<br><br>Add color change <input type="button" value="Timed" onclick="addColor();"> <input type="button"
				value="Dawn" onclick="addColor('dawn');"> <input type="button" value="Dusk" onclick="addColor('dusk');">
			<br><br>
			<div id="location" style="display: none; margin-bottom: 2em;">Location <input type="button" value="Clear"
					onclick="locationAction('clear');"> <input type="button" value="Change"
					onclick="locationAction('change');"> </div>
			<div id="clockextras"></div>
			<textarea id="log" disabled
				style="min-height: 20em; width: 90%; background-color: #ccc; color: black; font-family: monospace; font-size: 1.2em;"></textarea>
		</div>
		<div id="overlay" class="untouched">
			<!--div id="messagedate" style="text-align: right; top: 2vw; font-size: 15%; padding-top: 2vw;"></div-->
			<div id="message"></div>
			<div id="controlpanel">
				<div id="caption"></div>
				<div id="controlpanelbuts"></div>
			</div>
		</div>
		<div style="font-size: 4vw; display: block; position: absolute; top: 1.5vw; left: 1vw;">
			<input id="alarm" type="checkbox" value="" oninput="setAlarm(event.target.checked, 0)"
				style="display: none;">
			<label id="alarmlabel" for="alarm" style="padding: 0.3em;"><span id="alarmtimetext"></span></label>
		</div>
	</div>
</body>

</html>
