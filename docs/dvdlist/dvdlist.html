<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<title>DVD List</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
	<link rel="icon" type="image/png" href="/favicon.png" />
	<style>
		body {
			text-align: center;
			font-family: sans-serif;
			font-size: 120%;
			padding-top: 0em;
			padding-bottom: 5em;
			margin: 0;
		}

		#headtitle {
			font-size: 1em;
			padding: 1em;
			font-weight: bold;
			background-color: yellow;
		}
	</style>
	<script>
		"use strict"
		let swk;
		let swr;
		try {
			//console.clear();
			if ('serviceWorker' in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register('sw.js')
						.then(registration => {
							swr = registration;
							swk = registration.active;
							console.log("Service worker registered");
							navigator.serviceWorker.addEventListener("message", (event) => {
								let el;
								if (event.type == "message") {
								}
							});
						})
						.catch(err => console.error(`Service Worker Error: ${err}`));
				});
			}
		} catch (e) {
			console.error(e);
		}			
	</script>
	<script src="/common/storage.js"></script>
	<script src="/common/menu2.js"></script>
	<script src="version.js"></script>
</head>

<body>
	<div id="headtitle" style="position: fixed; width: 100%;"></div>
	<div id="subfrom" style="padding-top: 4em;">
		<div style="clear: left;">
			<div id="historylist" style="text-align: initial; ">
			</div>
		</div>
	</div>


	<script type="text/javascript">
		"use strict"

		let dvdList;
		let rows = [];
		let findDvd = [];
		let highlightedRows = [];

		console.clear();
		console.log("starting");

		let localFilters = { genres: [], countries: [] };

		fetch("/test/dvddata.json").then(response => {
			response.json().then(data => {
				dvdList = data;
				console.log("dvddata.json");
				localFilters = { genres: dvdList.genres, countries: dvdList.countries };
				preProcess();
			});
		}).catch(e => {
			console.error(e);
		});

		window.addEventListener("hashchange", () => {
			//document.getElementById("historylist").innerHTML = "";
			frontPage();
		});

		// window.addEventListener("scroll", (event) => {
		// 	if (!promptContext.selfScroll) {
		// 		page.findruler.style.top = "-100px";
		// 	}
		// });

		let pageSelection = decodeURIComponent(location.hash).replace("#", "");

		const page = {};
		const all = document.querySelectorAll("*[id]");
		all.forEach((val) => {
			page[val.id] = val;
		});

		function preProcess() {

			console.log("preProcess");

			let currentPage;
			let newWin = false;
			let menu = [];

			try {
				pageSelection = JSON.parse(pageSelection);
			} catch (e) {
				pageSelection = {};
			}

			dvdList.countries.sort();
			dvdList.genres.sort();

			dvdList.movies.findIndex((row, ix) => {
				let title = row.title.toLowerCase().match(/[a-zA-Z0-9 ]/g)?.join('');
				findDvd.push(title);
			});

			let genres = () => {
				let glist = [
					{
						title: "-All-", func: x => {
							if (pageSelection.genre) {
								delete pageSelection.genre;
								setHash();
							}
							return true;
						}
					}
				];
				localFilters.genres.forEach((genre, ix) => {
					let gn = {
						title: genre, func: x => {
							if (pageSelection.genre != genre) {
								pageSelection.genre = genre;
								setHash();
							}
							return true;
						}
					};
					if ((ix + 2) % 12 == 0) {
						gn.break = true;
					}
					glist.push(gn)
				});
				return glist;
			};

			let countries = () => {
				let clist = [
					{
						title: "-All-", func: x => {
							if (pageSelection.country) {
								delete pageSelection.country;
								setHash();
							}
							return true;
						}
					}
				];
				localFilters.countries.forEach((country, ix) => {
					let ctr = {
						title: country, func: x => {
							if (pageSelection.country != country) {
								pageSelection.country = country;
								setHash();
							}
							return true;
						}
					};
					if ((ix + 2) % 12 == 0) {
						ctr.break = true;
					}
					clist.push(ctr);
				});
				return clist;
			}

			let sortTypes = () => {
				let clist = [
					{
						title: "Sort by title", func: e => {
							if (pageSelection.sort) {
								delete pageSelection.sort;
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by run time", func: e => {
							if (pageSelection.sort != "by run time") {
								pageSelection.sort = "by run time";
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by year", func: e => {
							if (pageSelection.sort != "by year") {
								pageSelection.sort = "by year";
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by recent", func: e => {
							if (pageSelection.sort != "by recent") {
								pageSelection.sort = "by recent";
								setHash();
							}
							return true;
						}
					}];
				return clist;
			}

			function setHash() {
				location.hash = JSON.stringify(pageSelection);
			}

			function resetMe() {
				swr.unregister();
				const pathname = location.pathname.split("/")[1];
				caches.delete(pathname + "/" + cacheName);
				document.body.innerHTML = "Resetting " + cacheName;
			}

			function locateName(name) {
				highlightedRows.forEach(n => {
					rows[n].style.backgroundColor = "transparent";
				});

				if (!name) {
					return;
				}

				highlightedRows = [];

				let allFirst = [];
				let allWord = [];
				let allDone = new Set();
				name = name.toLowerCase().match(/[a-zA-Z0-9 ]/g)?.join('');
				name = name.replace(/^the /i, "");
				if (!name) {
					return;
				}
				findDvd.forEach((title, ix) => {
					if (title.includes(" " + name)) {
						allWord.push(ix);
					}
					if (title.substring(0, 4) == "the ") {
						title = title.substring(4);
					}
					if (title.startsWith(name)) {
						allFirst.push(ix);
					}
				});
				let pos = allFirst.length ? allFirst[0] :
					allWord.length ? allWord[0] : -1;

				if (pos >= 0) {
					rows[Math.max(pos - 5, 0)].scrollIntoView();

					allFirst.forEach(n => {
						rows[n].style.backgroundColor = "lightgreen";
						highlightedRows.push(n);
						allDone.add(n);
					});

					allWord.forEach(n => {
						if (allDone.has(n)) return;
						rows[n].style.backgroundColor = "yellow";
						highlightedRows.push(n);
						allDone.add(n);
					});

				}
			}

			CbMakeMenu(() => {
				let hash = location.hash;

				let menuList = [
					{
						title: "Show all", func: e => {
							pageSelection = {};
							setHash();
							return true;
						}
					},
					{
						title: "Sort", submenu: sortTypes
					},
					{
						title: "Genre", submenu: genres
					},
					{
						title: "Country", submenu: countries
					}];

				if (hash == "" || hash == "#{}") {
					menuList.unshift(
						{
							title: "Find ...", func: e => {
								CbPrompt("Find", "", frontPage, 
									e => {
										if (e.type == "input") {
											locateName(e.target.value);
										}
									});
								return true;
							}
						}
					)
				}

				return menuList;
			}, resetMe, { position: "fixed" });

			frontPage();
		}

		function sortMovies() {
			if (pageSelection.sort) {
				if (pageSelection.sort == "by run time") {
					dvdList.movies.sort((a, b) => {
						return a.runtime - b.runtime;
					});
				}
				if (pageSelection.sort == "by year") {
					dvdList.movies.sort((a, b) => {
						return a.year - b.year;
					});
				}
				if (pageSelection.sort == "by recent") {
					dvdList.movies.sort((a, b) => {
						// reverse sequence
						return b.lineNo - a.lineNo;
					});
				}
			} else { //default sort by title	
				dvdList.movies.sort((a, b) => {
					return a.rowNo - b.rowNo;
				});
			}
		}


		function frontPage() {
			console.log(pageSelection);
			rows = [];
			let selections = Object.values(pageSelection).join(", ");
			page.headtitle.innerHTML = "DVDs " + selections;
			page.headtitle.style.backgroundColor = "lightgrey";
			page.historylist.innerHTML = "";
			let table = document.createElement("table");
			table.style.width = "100%";
			table.style.borderCollapse = "collapse";
			page.historylist.appendChild(table);
			let genresSet = new Set();
			let countriesSet = new Set();
			sortMovies();
			dvdList.movies.forEach((movie, ix) => {
				if (pageSelection.genre) {
					if (!movie.genres.includes(pageSelection.genre)) {
						return;
					}

					movie.country.forEach(country => {
						countriesSet.add(country);
					});
				}
				if (pageSelection.country) {
					if (!movie.country.includes(pageSelection.country)) {
						return;
					}
					movie.genres.forEach(genre => {
						genresSet.add(genre);
					});
				}
				let row = document.createElement("tr");

				table.appendChild(row);

				let mainRow = document.createElement("td");
				mainRow.style.textIndent = "0.5em hanging";
				mainRow.style.height = "2em";
				mainRow.style.paddingLeft = "0.5em";
				mainRow.style.width = "100%";
				mainRow.style.verticalAlign = "middle";
				//mainRow.style.display = "inline-block";

				let title = document.createElement("span");
				title.innerHTML = movie.title;
				title.style.cursor = "pointer";
				title.onclick = () => {
					window.open("https://www.themoviedb.org/movie/" + movie.id, "_blank");
				}
				mainRow.appendChild(title);
				row.appendChild(mainRow);

				let hoursMins = document.createElement("td");
				hoursMins.style.verticalAlign = "middle";
				hoursMins.style.minWidth = "3em";
				hoursMins.innerHTML = movie.hoursMins;
				row.appendChild(hoursMins);

				let year = document.createElement("td");
				year.style.verticalAlign = "middle";
				year.style.paddingRight = "0.5em";
				year.innerHTML = movie.year;
				row.appendChild(year);

				row.style.margin = "0.5em";
				rows.push(row);

				//page.historylist.appendChild(row);

			});
			if (pageSelection.country) {
				localFilters.genres = [...genresSet];
			} else {
				localFilters.genres = dvdList.genres;
			}
			if (pageSelection.genre) {
				localFilters.countries = [...countriesSet];
			} else {
				localFilters.countries = dvdList.countries;
			}
		}

	</script>

</body>

</html>
