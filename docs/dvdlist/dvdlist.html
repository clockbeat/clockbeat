<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<title>DVD List</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
	<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
	<link rel="icon" type="image/png" href="/favicon.png" />
	<style>
		body {
			text-align: center;
			font-family: sans-serif;
			font-size: 120%;
			padding-top: 0em;
			padding-bottom: 5em;
			margin: 0;
		}

		#headtitle {
			font-size: 1em;
			padding: 1em;
			font-weight: bold;
			background-color: lightgrey;
		}

		#rightChoiceEl {
			float: right;
			margin-right: 0.5em;
			position: relative;
			bottom: -0.8em;
			margin: 0 0.9em 0.1em 0;
			font-size: 110%;
			border: 0;
			background-color: unset;
			color: rgb(145, 146, 146);
			cursor: pointer;
			padding-top: 0.5em;
			border-width: 1px 1px 0 1px;
			border-style: solid;
			border-radius: 50% 50% 0% 0;
			border-color: grey;
			min-width: 3em;
		}

	</style>
	<script>
		"use strict"
		let swk;
		let swr;
		try {
			//console.clear();
			if ('serviceWorker' in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register('sw.js')
						.then(registration => {
							swr = registration;
							swk = registration.active;
							console.log("Service worker registered");
							navigator.serviceWorker.addEventListener("message", (event) => {
								let el;
								if (event.type == "message") {
								}
							});
						})
						.catch(err => console.error(`Service Worker Error: ${err}`));
				});
			}
		} catch (e) {
			console.error(e);
		}			
	</script>
	<script src="/common/storage.js"></script>
	<script src="/common/menu2.js"></script>
	<script src="version.js"></script>
</head>

<body>
	<div id="headtitle" style="position: fixed; width: 100%;">
		<span id="headtitletext"></span>
		<input id="rightChoiceEl" type="button" value="Year">
	</div>
	<div id="subfrom" style="padding-top: 4em;">
		<div style="clear: left;">
			<div id="historylist" style="text-align: initial; ">
			</div>
		</div>
	</div>


	<script type="text/javascript">
		"use strict"

		let dvdList;
		let rows = [];
		let findDvd = [];
		let highlightedRows = [];
		let pageSelection = {};
		let updateMenu = () => { };
		let seenVideo;
		let seenTd;
		let seenDecode = ["Not", "Seen", "Part", "DVD"];
		seenDecode[99] = "?"
		// seen: 99 = not set
		let rightChoices = ["Year", "Seen", "Vol"];
		let rightChoice = 0;
		let seenGenres = ["Unseen", "Seen", "Part seen", "Seen DVD"];

		let highlights = ["", "fee", "efe", "eef"];

		let storage = new CbStorage("dvdlist");
		let localuserdata = storage.getItem("userdata") ?? {};
		storage.setItem("userdata", localuserdata);

		console.clear();
		console.log("starting");

		let localFilters = { genres: [] };
		let volumes = [];

		fetch("/test/dvddata.json").then(response => { //test is what live uses
			response.json().then(data => {
				dvdList = data;
				console.log("dvddata.json");
				localFilters = { genres: dvdList.genres };
				volumes = dvdList.volumes;
				preProcess();
			});
		}).catch(e => {
			console.error(e);
		});

		window.addEventListener("popstate", () => {
			getHashAsJson();
			console.log("popstate");
			frontPage();
		});

		function setHash() {
			location.hash = JSON.stringify(pageSelection);
		}

		const page = {};
		const all = document.querySelectorAll("*[id]");
		all.forEach((val) => {
			page[val.id] = val;
		});

		function getHashAsJson() {
			let pageSelectionHash = decodeURIComponent(location.hash).replace("#", "");
			try {
				pageSelection = JSON.parse(pageSelectionHash);
			} catch (e) {
				pageSelection = {};
			}
		}

		function menuDiv(div) {
			let changeCol = document.createElement("input");
			changeCol.type = "button";
			changeCol.value = "&#10559;";
			div.appendChild(changeCol);
		}

		page.rightChoiceEl.onclick = e => {
			rightChoice = (rightChoice + 1) % 3;
			frontPage();
			rightChoiceEl.value = rightChoices[rightChoice];
		}

		function preProcess() {

			console.log("preProcess");

			let currentPage;
			let newWin = false;
			let menu = [];

			getHashAsJson();

			dvdList.genres.sort();

			let previousByType = {};
			//tv: "-- Start --", movie: "-- Start --"

			dvdList.videos.findIndex((row, ix) => {
				let title = row.title.toLowerCase().match(/[a-zA-Z0-9 ]/g)?.join('');
				findDvd.push(title);
				if (localuserdata[row.type + "#" + row.id]) {
					if (JSON.stringify(row.userdata) == JSON.stringify(localuserdata[row.type + "#" + row.id])) {
						delete localuserdata[row.type + "#" + row.id];
					} else {
						row.userdata = localuserdata[row.type + "#" + row.id]
					}
				}
				let seenType = row.userdata.seen ?? 99;
				row.genres.push(seenGenres[seenType]);
				row.previous = previousByType[row.type] ?? "-- Start --";
				previousByType[row.type] = row.title;
			});
			storage.save();

			let genres = (controls) => {
				let glist = [
					{
						title: "-All-", func: x => {
							if (pageSelection.genre) {
								delete pageSelection.genre;
								setHash();
							}
							return true;
						}
					}
				];
				localFilters.genres.forEach((genre, ix) => {
					let gn = {
						title: genre, func: x => {
							if (pageSelection.genre != genre) {
								pageSelection.genre = genre;
								setHash();
							}
							return true;
						}
					};
					glist.push(gn)
				});
				console.log(controls);
				controls.style.columnCount = 2;
				controls.style.minWidth = "60vw";
				return glist;
			};

			let sortTypes = (controls) => {
				let clist = [
					{
						title: "Sort by title", func: e => {
							if (pageSelection.sort) {
								delete pageSelection.sort;
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by run time", func: e => {
							if (pageSelection.sort != "by run time") {
								pageSelection.sort = "by run time";
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by year", func: e => {
							if (pageSelection.sort != "by year") {
								pageSelection.sort = "by year";
								setHash();
							}
							return true;
						}
					}, {
						title: "Sort by recent", func: e => {
							if (pageSelection.sort != "by recent") {
								pageSelection.sort = "by recent";
								setHash();
							}
							return true;
						}
					}];
				return clist;
			}

			function getUserDataAsJSON() {
				let userDataDump = {};
				dvdList.videos.forEach(dvd => {
					if (!dvd.userdata) {
						dvd.userdata = { seen: 0 };
					}
					userDataDump[dvd.type + "#" + dvd.id] = dvd.userdata;
				});
				return JSON.stringify(userDataDump);
			}

			let admin = (controls) => {
				let clist = [
					{
						title: "Download user data", func: async e => {
							let text = getUserDataAsJSON();
							let filename = `dvduserdata.json`;
							const fileHandle = await window.showSaveFilePicker({
								suggestedName: filename
							});
							const writable = await fileHandle.createWritable();
							await writable.write(text);
							await writable.close();

							return true; //to close menu
						}
					},
					{
						title: "Copy user data to clipboard", func: async function () {
							let text = getUserDataAsJSON();
							let len = CbBytes(text.length);
							if (text.length >= 20000) {
								navigator.clipboard.writeText("*** Failed - too long ***");
								CbWarning(`Failed - too long ${len}`);
								return;
							}
							navigator.clipboard.writeText(text);
							CbAlert(`Copied to clipboard ${len}`);
						}
					}
				];
				return clist;
			}

			function resetMe() {
				swr.unregister();
				const pathname = location.pathname.split("/")[1];
				caches.delete(pathname + "/" + cacheName);
				document.body.innerHTML = "Resetting " + cacheName;
			}

			function locateName(name) {
				if (!name) {
					rows.forEach(row => {
						row.style.display = "table-row";
						row.style.backgroundColor = "initial";
					});
					return;
				}

				rows.forEach(row => {
					row.style.display = "none";
				});

				highlightedRows = [];

				let allFirst = [];
				let allWord = [];
				let allDone = new Set();
				name = name.toLowerCase().match(/[a-zA-Z0-9 ]/g)?.join('');
				name = name.replace(/^the /i, "");
				if (!name) {
					return;
				}
				findDvd.forEach((title, ix) => {
					if (title.includes(" " + name)) {
						allWord.push(ix);
					}
					if (title.substring(0, 4) == "the ") {
						title = title.substring(4);
					}
					if (title.startsWith(name)) {
						allFirst.push(ix);
					}
				});
				let pos = allFirst.length ? allFirst[0] :
					allWord.length ? allWord[0] : -1;

				if (pos >= 0) {
					if (pos > 5) {
						rows[pos - 5].scrollIntoView();
					} else {
						window.scrollTo(0, 0);
					}

					allFirst.forEach(n => {
						rows[n].style.backgroundColor = "lightgreen";
						highlightedRows.push(n);
						rows[n].style.display = "inherit";
						allDone.add(n);
					});

					allWord.forEach(n => {
						if (allDone.has(n)) return;
						rows[n].style.backgroundColor = "yellow";
						highlightedRows.push(n);
						rows[n].style.display = "inherit";
						allDone.add(n);
					});

				}
			}

			updateMenu = CbMakeMenu((controls) => {
				let hash = location.hash;

				let menuList = [
					{
						title: "Show all", func: e => {
							pageSelection = {};
							setHash();
							return true;
						}
					},
					{
						title: "Sort", submenu: sortTypes
					},
					{
						title: "Filter", submenu: genres
					},
					{
						title: "Admin", submenu: admin
					}];

				if (hash == "" || hash == "#{}") {
					menuList.unshift(
						{
							title: "Find ...", func: e => {
								let clickPoint;
								CbPrompt("Find", "", frontPage,
									e => {
										if (e.type == "input") {
											locateName(e.target.value);
										}
										if (e.type == "click") {
											clickPoint = { x: e.x, y: e.y };
											console.log(clickPoint);
										}
										let clickRow;
										if (e.type == "close") {
											if (clickPoint) {
												document.elementsFromPoint(clickPoint.x, clickPoint.y).forEach(el => {
													if (el.className == "histRow") {
														clickRow = el.dataset.rowNo;
													}
													console.log(el);
												});
												console.log(clickRow);
											}
											frontPage();
											if (clickRow) {
												rows[clickRow - 1].style.backgroundColor = "lightgreen";
												if (clickRow > 6) {
													clickRow -= 6;
													rows[clickRow].scrollIntoView();
												} else {
													page.historylist.scrollTo(0, 0);
												}
											}
										}
									});
								return true;
							}
						}
					)
				}
				return menuList;
			}, resetMe, { position: "fixed" });

			frontPage();
		}

		function sortMovies() {
			if (pageSelection.sort) {
				if (pageSelection.sort == "by run time") {
					dvdList.videos.sort((a, b) => {
						return a.runtime - b.runtime;
					});
				}
				if (pageSelection.sort == "by year") {
					dvdList.videos.sort((a, b) => {
						return a.year - b.year;
					});
				}
				if (pageSelection.sort == "by recent") {
					dvdList.videos.sort((a, b) => {
						// reverse sequence
						return b.lineNo - a.lineNo;
					});
				}
			} else { //default sort by title	
				dvdList.videos.sort((a, b) => {
					return a.rowNo - b.rowNo;
				});
			}
		}

		function seenUpdate(type) {
			if (seenVideo) {
				if (!seenVideo.userdata) {
					seenVideo.userdata = {};
				}
				seenVideo.userdata.seen = type;
				seenDecode.forEach(code => {
					let cd = seenVideo.genres.indexOf(code);
					if (cd >= 0) {
						seenVideo.genres.splice(cd, 1);
					}
				});
				seenVideo.genres.push(seenDecode[type]);
				//seenTd.className = "seen" + type;
				let id = seenVideo.type + "#" + seenVideo.id;
				localuserdata[id] = localuserdata[id] ?? {};
				localuserdata[id].seen = type;
				storage.save();
				frontPage();
			}
		}

		// &#10559; lower Left Semicircular Anticlockwise Arrow

		let seenTypes = {
			func: (controls, menuDiv) => {
				let clist = [
					{
						title: "Set as " + seenDecode[0], func: e => {
							seenUpdate(0);
							return true; //close menu
						}
					}, {
						title: "Set as " + seenDecode[1], func: e => {
							seenUpdate(1);
							return true; //close menu
						}
					}, {
						title: "Set as " + seenDecode[2], func: e => {
							seenUpdate(2);
							return true; //close menu
						}
					}, {
						title: "Set as " + seenDecode[3], func: e => {
							seenUpdate(3);
							return true; //close menu
						}
					}
				];
				controls.menuDiv.style.display = "block";
				return clist;
			}
		}


		function frontPage() {
			console.log(pageSelection);
			rows = [];
			let selections = Object.values(pageSelection).join(", ");
			page.headtitletext.innerHTML = "DVDs " + selections;
			page.historylist.innerHTML = "";
			let table = document.createElement("table");
			table.style.width = "100%";
			table.style.borderCollapse = "collapse";
			page.historylist.appendChild(table);
			let genresSet = new Set();
			sortMovies();
			dvdList.videos.forEach((video, ix) => {
				if (pageSelection.genre) {
					if (!video.genres.includes(pageSelection.genre)) {
						return;
					}
				}
				let row = document.createElement("tr");
				row.className = "histRow";
				row.dataset.rowNo = video.rowNo;
				let backgroundColor = "unset";
				if (video.highlight){
					row.style.backgroundColor = "#" + highlights[video.highlight];
				}

				let userdata = video.userdata ?? { seen: 99 };

				table.appendChild(row);

				let mainRow = document.createElement("td");
				mainRow.style.textIndent = "0.5em hanging";
				mainRow.style.height = "2em";
				mainRow.style.paddingLeft = "0.5em";
				mainRow.style.width = "100%";
				mainRow.style.verticalAlign = "middle";
				//mainRow.style.display = "inline-block";

				let title = document.createElement("span");
				let titleText = video.title;
				title.innerHTML = titleText;
				title.style.cursor = "pointer";
				title.onclick = () => {
					window.open("https://www.themoviedb.org/" + video.type + "/" + video.id, "_blank");
				}
				mainRow.appendChild(title);
				row.appendChild(mainRow);

				let hoursMins = document.createElement("td");
				hoursMins.style.verticalAlign = "middle";
				hoursMins.style.minWidth = "3em";
				if (video.type == "tv") {
					hoursMins.innerHTML = "" + video.episodes + "&times;" + video.runtime + "&nbsp;";
					//row.style.backgroundColor = "#efefff";
					title.innerHTML = title.innerHTML + " (tv)"
				} else {
					hoursMins.innerHTML = video.hoursMins;
				}
				row.appendChild(hoursMins);


				let rightCol = document.createElement("td");
				rightCol.style.verticalAlign = "middle";
				rightCol.style.paddingRight = "0.5em";
				//rightCol.className = "seen" + userdata.seen;
				rightCol.style.cursor = "pointer";
				switch (rightChoice) {
					case 0:
						rightCol.innerHTML = video.year;
						break;
					case 1:
						rightCol.innerHTML = seenDecode[userdata.seen];
						break
					case 2:
						let vol = video.volume + Math.min(video.volumePos / volumes[video.volume], 0.9)
						rightCol.innerHTML = vol.toFixed(1);
						break;
				}

				rightCol.onclick = e => {
					switch (rightChoice) {
						case 0:
							video.highlight = ((video.highlight ?? 0) + 1) % highlights.length;
							frontPage();
							break;
						case 1:
							seenVideo = video;
							seenTd = rightCol;
							updateMenu(seenTypes);
							break
						case 2:
							CbAlert("After: " + video.previous);
							break;
					}
					e.stopPropagation();
				}
				row.appendChild(rightCol);

				row.style.margin = "0.5em";
				rows.push(row);

			});
		}

	</script>

</body>

</html>
