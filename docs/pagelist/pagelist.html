<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<title>Page List</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="" icon" href="/favicon.ico" />
	<style>
		body {
			text-align: center;
			font-family: sans-serif;
			font-size: 120%;
			padding-top: 0em;
			padding-bottom: 5em;
			margin: 0;
		}

		#headtitle {
			font-size: 1.5em;
			padding: 0.5em;
			font-weight: bold;
			background-color: yellow;
		}
	</style>
	<script>
		let swk;
		let swr;
		try {
			console.clear();
			if ('serviceWorker' in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register('sw.js')
						.then(registration => {
							swr = registration;
							swk = registration.active;
							console.log("Service worker registered");
							navigator.serviceWorker.addEventListener("message", (event) => {
								let el;
								if (event.type == "message") {
									if (event.data.icon) {
										iconCreated();
									}
								}
							});
						})
						.catch(err => console.error(`Service Worker Error: ${err}`));
				});
			}
		} catch (e) {
			console.error(e);
		}			
	</script>
	<script src="/pagestore/common/storage.js"></script>
	<script src="/pagestore/common/menu.js"></script>
	<script src="version.js"></script>
</head>

<body>
	<div id="headtitle"></div>

	<div id="subfrom">
		<div style="clear: left;">
			<div id="historylist" style="text-align: initial; ">
			</div>
		</div>
	</div>
	<img id="icon" src="" style="opacity: 0; user-select: none;">

	<script type="text/javascript">
		console.clear();
		const page = {};
		const all = document.querySelectorAll("*[id]");
		all.forEach((val) => {
			page[val.id] = val;
		});
		let storage = new CbStorage("pagestore");
		let groups = storage.require("groups", {});
		let currentPage;
		let newWin = false;
		menu = [];
		page.icon.src = "/favicon.ico";

		window.addEventListener("hashchange", () => {
			location.reload();
		});

		console.log(location.href);

		let currentGroup = location.hash.replace("#", "");
		let groupColor = stringToColour(currentGroup);

		if (!currentGroup || !groups[currentGroup]) {
			currentGroup = null;
			menu.push({
				title: "Edit", url: "/pagestore/pagestore.html"
			});
			menu.push({
				title: "Reset App", func: e => {
					swr.unregister();
					const pathname = location.pathname.split("/")[1];
					caches.delete(pathname + "/" + cacheName);
					location.reload();
				}
			});
		} else {
			menu.push({
				title: "Edit", url: "/pagestore/pagestore.html#group=" + currentGroup
			});
			menu.push({
				title: "Index", func: e => { location.hash = ""; }
			});
		}

		addEventListener("focus", () => {
			if (swk) {
				swk.postMessage({ icon: true, title: currentGroup, color: groupColor });
			}
		});

		function iconCreated() {
			page.icon.src = "/favicon.ico";
		}

		refreshList(currentGroup);

		async function sendToEdit() {
			let gotopage = "/pagestore/pagestore.html#group=" + currentGroup;
			console.log(gotopage);
			location = gotopage;
		}

		function frontPage() {
			page.headtitle.innerHTML = "All";
			page.headtitle.style.backgroundColor = "grey";
			page.historylist.innerHTML = "";
			Object.keys(groups).forEach((group, ix) => {
				let itemSpan = document.createElement("div");
				let title = document.createElement("span");
				title.style.cursor = "pointer";
				title.innerHTML = "&#9776; &nbsp;&nbsp;" + group;
				itemSpan.appendChild(title);
				itemSpan.style.margin = "1.5em";
				title.onclick = e => {
					location.hash = group;
				}
				page.historylist.appendChild(itemSpan);

			});
		}

		function refreshList(group) {
			if (!group || !groups[group]) {
				frontPage();
				return;
			}
			document.title = group;
			page.headtitle.innerHTML = group;
			page.headtitle.style.backgroundColor = groupColor;
			page.historylist.innerHTML = "";
			groups[group].forEach((pageData, ix) => {
				let itemSpan = document.createElement("div");
				let title = document.createElement("span");
				title.style.cursor = "pointer";
				title.innerHTML = pageData.title;
				itemSpan.appendChild(title);
				itemSpan.style.margin = "1.5em";
				title.onclick = e => {
					window.open(pageData.url, '_blank').focus();
				}
				page.historylist.appendChild(itemSpan);

			});
		}

	</script>

</body>

</html>
