<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
	<link rel="stylesheet" href="shareto.css">
	<script src="storage.js"></script>
	<script src="/common/menu2.js"></script>
	<script src="common.js"></script>
	<script src="version.js"></script>
	<script>
		let swr;
		try {
			console.clear();
			if ('serviceWorker' in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register('sw.js')
						.then(reg => {
							swr = reg;
							console.log("Service worker registered");
						})
						.catch(err => console.error(`Service Worker Error: ${err}`));
				});
			}
		} catch (e) {
			console.error(e);
		}			
	</script>
</head>

<body>
	<div id="installit"></div>
	<div id="subfrom">
		<div>Title (<span id="info"></span><a id="revert" href="#"> revert</a>)</div>
		<textarea id="title" wrap="soft" style="width: 90vw; height: 20vh;"></textarea>
		<div>Url (<a id="link" href="#">open</a>
			<a id="combine" href="#">combine</a>)
		</div>
		<textarea id="url" wrap="soft" style="width: 90vw; height: 20vh;"></textarea>
		<div id="buts">Share to &nbsp;&nbsp;</div>
		<div><input id="toqueue" type="button" style="background-color: bisque;" value="Queue"></div>
	</div>

	<script type="text/javascript">
		console.clear();
		const tick = " ✔"; // &#10003;";
		const page = {};
		const all = document.querySelectorAll("*[id]");
		all.forEach((val) => {
			page[val.id] = val;
		});
		let storage = new CbStorage("shareto");
		if (storage.getItem("histAge")) {
			storage.removeItem("history");
			storage.removeItem("queue");
			storage.removeItem("histAge");
			storage.save();
		}
		let dests = storage.require("destinations", []);
		let queue = storage.require("queue", {});
		let newWin = false;
		let search = Object.fromEntries(new URLSearchParams(location.hash.replace("#", "?")));
		let incomingTitle = search.name ?? "";
		let incomingUrl = search.description ?? "";

		// if (!window.matchMedia('(display-mode: standalone)').matches) {
		// 	page.installit.innerHTML = "** Install this web app **";
		// }		

		console.log(location);
		if (search.queue === undefined) {
			page.title.value = incomingTitle;
			page.url.value = incomingUrl;
		}

		applyEdits();

		dests.forEach(dest => {
			let inp = document.createElement("input");
			let newWin = false;
			inp.type = "button";
			inp.value = dest.name;
			inp.onclick = e => {
				let urlpage = page.url.value.replace(/^https?:\/\//, "");
				let url = page.url.value.replace(/^.*http/, "http");
				let loc = dest.url.replace("$title", encodeURIComponent(page.title.value)).replace("$url", encodeURIComponent(url)).replace("$page", urlpage);
				try {
					let url = new URL(loc);
					console.log(loc);
					if (!url.protocol.startsWith("http")) {
						throw ("Not http/s");
					}
					if (newWin) {
						window.open(loc, '_blank').focus();
					} else {
						location = loc;
					}
				} catch (e) {
					alert("Not a valid URL '" + loc + "'");
				}
			}
			page.buts.appendChild(inp);
		});

		page.toqueue.onclick = e => {
			let title = page.title.value;
			let url = page.url.value;
			if (url) {
				if (queue[url]) {
					queue[url].title = title;
				} else {
					queue[url] = { title };
				}
				storage.save();
			}
			location = "history.html";
		}

		buildMenu(storage);

		page.title.oninput = page.url.oninput = e => {
			page.revert.style.display = "none";
			if (page.title.value !== incomingTitle || page.url.value !== incomingUrl) {
				page.revert.style.display = "inline";
				revert.onclick = e => {
					page.title.value = incomingTitle;
					page.url.value = incomingUrl;
					page.revert.style.display = "none";
				}
			}
			page.info.innerHTML = page.title.value.length;
		}

		page.title.oninput();

		page.link.onclick = e => {
			e.preventDefault();
			if (!page.url.value) {
				return;
			}
			let url = new URL(page.url.value); //Fail if invalid
			if (!url.protocol.startsWith("http")) {
				throw ("Not http/s");
			}
			location = page.url.value;
		}

		page.combine.onclick = e => {
			e.preventDefault();
			page.title.value = page.title.value + "\n\n" + page.url.value;
			page.revert.style.display = "inline";
		}

		function applyEdits() {
			let edits = storage.getItem("edits");
			if (!edits) {
				return;
			}
			//Auto remove
			if (edits.artitle) {
				edits.artitle.forEach(str => {
					page.title.value = page.title.value.replace(str, "");
				});
				page.title.value = page.title.value.replace("  ", " ");
			}
			if (edits.arurl) {
				edits.arurl.forEach(str => {
					page.url.value = page.url.value.replace(str, "");
				});
				page.url.value = page.url.value.replace("  ", " ");
			}
		}

	</script>

</body>

</html>
